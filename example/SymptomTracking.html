<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "error": "#ba1a1a", "on-surface": "#1a1b1f", "outline-variant": "#e6bcbd", "on-primary-fixed": "#40000c", "inverse-surface": "#2f3034", "on-primary-container": "#fffbff", "secondary-fixed": "#6bfcb9", "surface-dim": "#dad9df", "on-error-container": "#93000a", "inverse-on-surface": "#f1f0f5", "outline": "#916e6f", "on-secondary-fixed": "#002113", "tertiary-fixed": "#d8e2ff", "on-surface-variant": "#5d3f40", "surface-tint": "#be0036", "surface-container-low": "#f4f3f8", "surface-bright": "#faf9fe", "on-primary": "#ffffff", "surface-container-highest": "#e3e2e7", "on-tertiary-container": "#fefcff", "surface-container": "#eeedf3", "on-primary-fixed-variant": "#920027", "background": "#faf9fe", "inverse-primary": "#ffb3b5", "on-tertiary": "#ffffff", "primary-fixed": "#ffdada", "tertiary-container": "#0070eb", "tertiary-fixed-dim": "#adc6ff", "primary-fixed-dim": "#ffb3b5", "on-tertiary-fixed-variant": "#004493", "secondary-container": "#68f9b6", "on-secondary": "#ffffff", "on-secondary-fixed-variant": "#005235", "primary": "#ba0034", "on-tertiary-fixed": "#001a41", "surface-container-lowest": "#ffffff", "on-background": "#1a1b1f", "secondary": "#006c47", "on-error": "#ffffff", "tertiary": "#0058bc", "surface-container-high": "#e9e7ed", "surface": "#faf9fe", "secondary-fixed-dim": "#49df9f", "surface-variant": "#e3e2e7", "error-container": "#ffdad6", "on-secondary-container": "#00714b", "primary-container": "#e51245" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "stack-gap": "1rem", "section-margin": "2rem", "grid-gutter": "0.75rem", "element-padding": "1rem", "container-margin": "1.25rem" }, "fontFamily": { "headline-md": ["Inter"], "body-sm": ["Inter"], "label-caps": ["Inter"], "body-lg": ["Inter"], "numeric-data": ["Inter"], "headline-sm": ["Inter"], "display-lg-mobile": ["Inter"], "display-lg": ["Inter"] } } } }</script><style>@layer base { body { -webkit-tap-highlight-color: transparent; } .pb-safe { padding-bottom: env(safe-area-inset-bottom); } .pt-safe { padding-top: env(safe-area-inset-top); } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-background font-body-lg text-on-background"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-container-margin flex items-center justify-between"><button class="w-10 h-10 flex items-center justify-start text-on-surface-variant" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios</span></button><span class="font-headline-sm text-headline-sm text-on-surface">Symptom Tracking</span><div class="w-10"></div></div></header><main class="relative pt-16 bg-surface min-h-screen"><div class="flex flex-col w-full gap-stack-gap px-container-margin pt-element-padding">
<!-- Header Section -->
<div class="flex flex-col gap-1 mt-2">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">症状追踪</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">记录您的身体感受，发现潜在规律。</p>
</div>
<!-- Quick Log Section -->
<div class="bg-surface-container rounded-3xl p-4 flex flex-col gap-4 mt-2 shadow-sm">
<div class="flex items-center justify-between">
<h2 class="font-headline-sm text-headline-sm text-on-surface">快速记录 (今日)</h2>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">edit_note</span>
</div>
<div class="flex flex-col gap-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">不适程度 (1-10)</span>
<div class="flex items-center gap-2">
<span class="font-numeric-data text-headline-sm text-on-surface w-4 text-center">1</span>
<div class="flex-1 h-3 bg-surface-variant rounded-full relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary rounded-full w-4/10" style="width: 40%;"></div>
</div>
<span class="font-numeric-data text-headline-sm text-on-surface w-4 text-center">10</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface text-center mt-1"><span class="font-bold text-primary">4</span> - 轻微不适</p>
</div>
<div class="flex flex-col gap-2 mt-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">常见症状</span>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 bg-primary text-on-primary rounded-full font-body-sm flex items-center gap-1 shadow-sm transition-transform active:scale-95">
<span class="material-symbols-outlined text-[18px]">sentiment_dissatisfied</span> 头痛
                </button>
<button class="px-4 py-2 bg-surface-variant text-on-surface rounded-full font-body-sm flex items-center gap-1 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[18px]">battery_0_bar</span> 疲劳
                </button>
<button class="px-4 py-2 bg-surface-variant text-on-surface rounded-full font-body-sm flex items-center gap-1 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[18px]">save_as</span> 胃痛
                </button>
<button class="px-4 py-2 bg-surface-variant text-on-surface rounded-full font-body-sm flex items-center gap-1 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[18px]">add</span> 更多
                </button>
</div>
</div>
<button class="mt-2 w-full py-3 bg-primary text-on-primary font-headline-sm rounded-xl shadow-md active:bg-on-primary-fixed-variant transition-colors">
            保存今日记录
        </button>
</div>
<!-- AI Health Analysis -->
<div class="relative rounded-3xl p-[2px] bg-gradient-to-br from-tertiary via-primary to-secondary mt-2 shadow-md">
<div class="bg-surface-container-lowest rounded-[22px] p-4 flex flex-col gap-3 h-full">
<div class="flex items-center gap-2 text-tertiary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<h3 class="font-headline-sm text-headline-sm">AI 健康洞察</h3>
</div>
<p class="font-body-sm text-body-sm text-on-surface">我们注意到您的<span class="text-primary font-bold">头痛</span>症状通常在<span class="text-secondary font-bold">高强度有氧运动</span>后的第二天出现。建议适当增加运动后的拉伸和水分补充。</p>
</div>
</div>
<!-- Calendar View -->
<div class="bg-surface-container rounded-3xl p-4 flex flex-col gap-4 mt-2">
<div class="flex items-center justify-between">
<h2 class="font-headline-sm text-headline-sm text-on-surface">本月记录</h2>
<div class="flex items-center text-primary">
<span class="material-symbols-outlined">chevron_left</span>
<span class="font-body-sm font-bold px-2">十月</span>
<span class="material-symbols-outlined">chevron_right</span>
</div>
</div>
<div class="grid grid-cols-7 gap-1 text-center font-label-caps text-on-surface-variant mb-2">
<div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
</div>
<div class="grid grid-cols-7 gap-y-2 gap-x-1 text-center font-body-sm text-on-surface">
<!-- Blank days for start of month -->
<div></div><div></div>
<div class="relative py-1">1</div>
<div class="relative py-1">2
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-primary rounded-full"></div>
</div>
<div class="relative py-1">3</div>
<div class="relative py-1">4</div>
<div class="relative py-1">5
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-tertiary rounded-full"></div>
</div>
<div class="relative py-1">6</div>
<div class="relative py-1">7</div>
<div class="relative py-1">8
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-primary rounded-full"></div>
</div>
<div class="relative py-1">9</div>
<div class="relative py-1">10</div>
<div class="relative py-1 bg-primary text-on-primary rounded-full font-bold shadow-sm">11</div>
<div class="relative py-1 text-on-surface-variant">12</div>
<!-- More days would follow... -->
</div>
<div class="flex items-center justify-center gap-4 mt-2 font-label-caps text-on-surface-variant text-[10px]">
<div class="flex items-center gap-1"><div class="w-2 h-2 bg-primary rounded-full"></div>有症状</div>
<div class="flex items-center gap-1"><div class="w-2 h-2 bg-tertiary rounded-full"></div>已记录 (无症状)</div>
</div>
</div>
<!-- Trend Chart -->
<div class="bg-surface-container rounded-3xl p-4 flex flex-col gap-4 mt-2 mb-6">
<h2 class="font-headline-sm text-headline-sm text-on-surface">症状趋势</h2>
<div class="h-40 w-full relative">
<!-- Simple SVG Line Chart representation -->
<svg class="w-full h-full" preserveaspectratio="none" viewbox="0 0 100 40">
<!-- Grid lines -->
<line class="text-surface-variant" stroke="currentColor" stroke-dasharray="2,2" stroke-width="0.2" x1="0" x2="100" y1="10" y2="10"></line>
<line class="text-surface-variant" stroke="currentColor" stroke-dasharray="2,2" stroke-width="0.2" x1="0" x2="100" y1="20" y2="20"></line>
<line class="text-surface-variant" stroke="currentColor" stroke-dasharray="2,2" stroke-width="0.2" x1="0" x2="100" y1="30" y2="30"></line>
<!-- Line -->
<path class="text-primary" d="M 0,35 L 20,25 L 40,30 L 60,15 L 80,20 L 100,5" fill="none" stroke="currentColor" stroke-width="1.5"></path>
<!-- Points -->
<circle class="text-primary" cx="20" cy="25" fill="currentColor" r="1.5"></circle>
<circle class="text-primary" cx="40" cy="30" fill="currentColor" r="1.5"></circle>
<circle class="text-primary" cx="60" cy="15" fill="currentColor" r="1.5"></circle>
<circle class="text-primary" cx="80" cy="20" fill="currentColor" r="1.5"></circle>
<circle class="text-primary" cx="100" cy="5" fill="currentColor" r="1.5"></circle>
<!-- Area under curve gradient -->
<lineargradient id="chartGradient" x1="0" x2="0" y1="0" y2="1">
<stop class="text-primary" offset="0%" stop-color="currentColor" stop-opacity="0.2"></stop>
<stop class="text-primary" offset="100%" stop-color="currentColor" stop-opacity="0"></stop>
</lineargradient>
<path d="M 0,35 L 20,25 L 40,30 L 60,15 L 80,20 L 100,5 L 100,40 L 0,40 Z" fill="url(#chartGradient)"></path>
</svg>
<div class="absolute bottom-0 left-0 w-full flex justify-between text-label-caps text-on-surface-variant translate-y-5">
<span>周一</span>
<span>周三</span>
<span>周五</span>
<span>周日</span>
</div>
</div>
</div>
</div><div class="pb-safe"></div></main></body></html>
