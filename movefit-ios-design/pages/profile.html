  --movefit-neutral-200: #d1d1d6;

  --movefit-move: #f20540;
  --movefit-exercise: #21c747;
  --movefit-stand: #1ea8f2;
  --movefit-sleep: #5945e0;
  --movefit-challenge: #943fde;

@theme inline {

  --color-exercise: var(--movefit-exercise);
  --color-stand: var(--movefit-stand);
  --color-sleep: var(--movefit-sleep);

  --movefit-background: #f2f2f7;
  --movefit-foreground: #1c1c1e;

  --movefit-card-foreground: #1c1c1e;

  --movefit-popover-foreground: #1c1c1e;

  --movefit-input: #ffffff;
  --movefit-ring: #ba0034;
}

  --movefit-input: #1c1c1e;
  --movefit-ring: #ff4d6d;
}

/* Typography */
body {

.font-rounded {

.font-mono-num {

/* iOS-style safe area utilities */
.pt-safe { padding-top: env(safe-area-inset-top); }
.pb-safe { padding-bottom: env(safe-area-inset-bottom); }

.hide-scrollbar::-webkit-scrollbar { display: none; }

}

/* Floating layer shadow */
.float-shadow {
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
}
