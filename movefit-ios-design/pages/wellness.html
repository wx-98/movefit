:root {

  --movefit-primary-50: #fff1f3;

  --movefit-primary-300: #ff7a8d;
  --movefit-primary-400: #f53d5a;

  --movefit-primary-600: #97002b;
  --movefit-primary-700: #740022;
  --movefit-primary-800: #520018;
  --movefit-primary-900: #31000e;

  /* Neutral Scale (iOS System Grays) */
  --movefit-neutral-50: #f2f2f7;
  --movefit-neutral-100: #e5e5ea;
  --movefit-neutral-200: #d1d1d6;
  --movefit-neutral-300: #c7c7cc;
  --movefit-neutral-400: #aeaeb2;
  --movefit-neutral-500: #8e8e93;

  --movefit-neutral-700: #48484a;

  /* Semantic Health Colors */
  --movefit-move: #f20540;
  --movefit-exercise: #21c747;
  --movefit-stand: #1ea8f2;
  --movefit-sleep: #5945e0;
  --movefit-challenge: #943fde;
  --movefit-orange: #f57a1f;
  --movefit-teal: #089e91;

  /* State Colors */
  --movefit-state-success: #21c747;
  --movefit-state-warning: #f57a1f;

  --movefit-card-foreground: #1c1c1e;

  --movefit-radius-small: 8px;
  --movefit-radius-medium: 12px;
  --movefit-radius-large: 16px;
  --movefit-radius-full: 9999px;
}

@theme inline {

  --color-foreground: var(--movefit-foreground);
  --color-card: var(--movefit-card);
  --color-card-foreground: var(--movefit-card-foreground);
  --color-popover: var(--movefit-popover);

  --color-ring: var(--movefit-ring);

  --radius-lg: var(--movefit-radius-large);
  --radius-full: var(--movefit-radius-full);

  --color-move: var(--movefit-move);
  --color-exercise: var(--movefit-exercise);
  --color-stand: var(--movefit-stand);
  --color-sleep: var(--movefit-sleep);

  --color-teal: var(--movefit-teal);

  --color-warning: var(--movefit-state-warning);
  --color-error: var(--movefit-state-error);
  --color-info: var(--movefit-state-info);
}

/* Light mode base */
html.light,
:root {
  --movefit-background: #f2f2f7;
  --movefit-foreground: #1c1c1e;
  --movefit-card: #ffffff;
  --movefit-card-foreground: #1c1c1e;

  --movefit-border: rgba(255, 255, 255, 0.12);
  --movefit-input: #1c1c1e;
  --movefit-ring: #ff4d6d;
}

/* Typography */
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;

.font-rounded {

/* iOS-style safe area utilities */
.pt-safe { padding-top: env(safe-area-inset-top); }

/* Hide scrollbar for horizontal scroll areas */
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* Subtle card shadow */
.card-shadow {

}

/* Floating layer shadow */
.float-shadow {
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
}

<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen bg-background px-4 pt-safe pb-8">
        <!-- Back navigation header -->
        <header class="relative flex items-center justify-center h-12 mt-safe">
            <button data-dom-id="back-profile" type="button" class="absolute left-0 flex items-center gap-1 text-primary" aria-label="返回">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
                <span class="text-base">返回</span>
            </button>
            <h1 class="text-lg font-semibold text-foreground">养护建议</h1>
        </header>

        <!-- 今日建议 -->
        <section class="mt-6">
            <h2 class="mb-3 text-sm font-semibold uppercase tracking-wide text-muted-foreground">今日建议</h2>
            <div class="space-y-3">
                <article class="flex items-start gap-4 rounded-radius-lg bg-card p-4 card-shadow">
                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-move/10 text-move">
                        <i data-lucide="leaf" class="h-5 w-5"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <h3 class="text-base font-semibold text-card-foreground">增加活动</h3>
                        <p class="mt-1 text-sm text-muted-foreground">今天步数偏少，建议步行 15 分钟。</p>
                    </div>
                </article>

                <article class="flex items-start gap-4 rounded-radius-lg bg-card p-4 card-shadow">
                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-exercise/10 text-exercise">
                        <i data-lucide="heart-pulse" class="h-5 w-5"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <h3 class="text-base font-semibold text-card-foreground">保持恢复</h3>
                        <p class="mt-1 text-sm text-muted-foreground">昨晚睡眠充足，适合中等强度训练。</p>
                    </div>
                </article>

                <article class="flex items-start gap-4 rounded-radius-lg bg-card p-4 card-shadow">
                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-stand/10 text-stand">
                        <i data-lucide="sun" class="h-5 w-5"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <h3 class="text-base font-semibold text-card-foreground">增加站立</h3>
                        <p class="mt-1 text-sm text-muted-foreground">久坐提醒，每小时起身活动。</p>
                    </div>
                </article>
            </div>
        </section>

        <!-- 收藏文章 -->
        <section class="mt-8">
            <h2 class="mb-3 text-sm font-semibold uppercase tracking-wide text-muted-foreground">收藏文章</h2>
            <div class="space-y-3">
                <article class="flex items-center gap-4 rounded-radius-lg bg-card p-4 card-shadow">
                    <div class="min-w-0 flex-1">
                        <h3 class="text-base font-semibold text-card-foreground">运动后如何科学拉伸</h3>
                        <p class="mt-1 text-sm text-muted-foreground">掌握静态与动态拉伸的时机，帮助身体更快恢复。</p>
                    </div>
                    <button type="button" class="shrink-0 text-primary" aria-label="取消收藏">
                        <i data-lucide="bookmark" class="h-5 w-5"></i>
                    </button>
                </article>

                <article class="flex items-center gap-4 rounded-radius-lg bg-card p-4 card-shadow">
                    <div class="min-w-0 flex-1">
                        <h3 class="text-base font-semibold text-card-foreground">改善睡眠的 5 个习惯</h3>
                        <p class="mt-1 text-sm text-muted-foreground">从作息、光线到睡前饮食，逐步提升睡眠质量。</p>
                    </div>
                    <button type="button" class="shrink-0 text-muted-foreground" aria-label="收藏">
                        <i data-lucide="bookmark-plus" class="h-5 w-5"></i>
                    </button>
                </article>

                <article class="flex items-center gap-4 rounded-radius-lg bg-card p-4 card-shadow">
                    <div class="min-w-0 flex-1">
                        <h3 class="text-base font-semibold text-card-foreground">久坐族的微运动指南</h3>
                        <p class="mt-1 text-sm text-muted-foreground">每小时 2 分钟简单动作，缓解肩颈与腰背紧张。</p>
                    </div>
                    <button type="button" class="shrink-0 text-muted-foreground" aria-label="收藏">
                        <i data-lucide="bookmark-plus" class="h-5 w-5"></i>
                    </button>
                </article>
            </div>
        </section>

        <!-- Disclaimer footer -->
        <footer class="mt-10 flex items-start gap-2 rounded-radius-lg bg-muted p-4">
            <i data-lucide="info" class="mt-0.5 h-4 w-4 shrink-0 text-muted-foreground"></i>
            <p class="text-xs leading-relaxed text-muted-foreground">
                建议基于本地健康数据生成，仅供参考，不构成医疗诊断。如有持续不适或异常变化，请咨询合格专业人员。
            </p>
        </footer>
